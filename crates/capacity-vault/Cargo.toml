[package]
name = "capacity-vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
capacity-domain = { path = "../capacity-domain" }
capacity-store = { path = "../capacity-store" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_System_Threading"] }
