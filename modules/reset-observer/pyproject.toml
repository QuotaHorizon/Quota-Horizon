[project]
name = "reset-observer"
version = "0.1.0"
description = "Independent prospective observation and evaluation of quota relief forecasts"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3"]

[project.scripts]
reset-observer = "reset_observer.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reset_observer*"]
