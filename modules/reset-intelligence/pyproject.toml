[project]
name = "reset-intelligence"
version = "0.1.0"
description = "Independent collection, forecasting and evaluation of public quota relief events"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3"]

[project.scripts]
reset-intelligence = "reset_intelligence.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reset_intelligence*"]
