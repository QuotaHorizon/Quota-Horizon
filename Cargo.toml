[workspace]
members = [
    "apps/capacity-preview/src-tauri",
    "crates/capacity-cli",
    "crates/capacity-domain",
    "crates/capacity-migration",
    "crates/capacity-mutation",
    "crates/capacity-store",
    "crates/capacity-vault",
    "crates/codex-runtime",
    "crates/fake-app-server",
]
exclude = ["apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive"] }
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
